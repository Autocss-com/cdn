<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="author" content="D7460N" />
    <meta name="description" content="AutoCSS Template" />
    <meta name="robots" content="index, archive" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="assets/images/brand/logo.svg"
    />
    <link rel="stylesheet" href="assets/css/reset.css" />
    <link rel="stylesheet" href="assets/css/layout.css" />
    <link rel="stylesheet" href="assets/css/media.css" />
    <link rel="stylesheet" href="assets/css/scrolling.css" />
    <link rel="stylesheet" href="assets/css/fonts.css" />
    <link rel="stylesheet" href="assets/css/typography.css" />
    <link rel="stylesheet" href="assets/css/inputs.css" />
    <link rel="stylesheet" href="assets/css/a11y.css" />
    <link rel="stylesheet" href="assets/css/transitions.css" />
    <!-- <link rel="stylesheet" href="assets/css/corners.css" /> -->
    <link rel="stylesheet" href="assets/css/color-scheme.css" />
    <link rel="stylesheet" href="assets/css/color-theme-66ccff.css" />
    <!-- <link rel="stylesheet" href="assets/css/diag.css"> -->
    <title>AutoCSS Template: Corners Demo</title>
  </head>
  <body>
    <app-container>
      <app-banner>BANNER</app-banner>
      <header>
        <app-logo>LOGO</app-logo>
        <app-user>USER</app-user>
      </header>
      <nav>
        <label>
          NAV
          <input type="radio" name="nav" />
        </label>
      </nav>
      <main>
        <article tabindex="0">
          <h1></h1>
          <p></p>
          <!-- Data table: two separate <ul>s. HEAD (aria-hidden) carries the
               column labels; BODY holds one <li> per record. Both come from the
               `rows` contract via table.js. -->
          <ul aria-hidden="true"><li></li></ul>
          <ul></ul>
        </article>
      </main>
      <aside>
        <!-- Edit form: built from the selected row's own cells (no schema). -->
        <form>
          <fieldset></fieldset>
          <label>Save<input type="checkbox" name="save" hidden /></label>
          <label>Reset<input type="checkbox" name="reset" hidden /></label>
          <label>Delete<input type="checkbox" name="delete" hidden /></label>
        </form>
      </aside>
      <footer>
        <app-legal>LEGAL</app-legal>
        <app-version>VERSION</app-version>
      </footer>
      <app-banner>BANNER</app-banner>
      <template>
        <section></section><article></article><h1></h1><h2></h2><h3></h3><h4></h4>
        <p></p><ul></ul><ol></ol><li></li><dl></dl><dt></dt><dd></dd>
        <figure></figure><figcaption></figcaption><blockquote></blockquote>
        <table></table><thead></thead><tbody></tbody><tr></tr><th></th><td></td>
        <details></details><summary></summary><form></form><fieldset></fieldset>
        <legend></legend><label><input type="radio" name="nav" /></label><input><select></select><textarea></textarea>
        <button></button><img alt=""><time></time><address></address><search></search>
        <dialog></dialog><hgroup></hgroup><picture></picture><source><video></video>
        <audio></audio><track><meter></meter><progress></progress><output></output>
        <datalist></datalist><option></option><optgroup></optgroup><caption></caption>
        <colgroup></colgroup><col><tfoot></tfoot><abbr></abbr><cite><code></code>
        <data></data><time></time><em></em><strong></strong><kbd></kbd><mark></mark>
        <q></q><s></s><samp></samp><small></small><sub></sub><sup></sup><var></var><wbr><hr>
      </template>
    </app-container>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
